services:
  - type: web
    name: developer-tech-stack-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python -m app.db.init_db
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
